name: Deploy SELCO SevaConnect to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build production bundle
        run: |
          npm run build
          cp dist/index.html dist/404.html 2>/dev/null || true

      - name: Deploy to gh-pages branch (for Branch Deployment)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages

      - name: Setup Pages (for Actions Deployment)
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: './dist'

      - name: Deploy to GitHub Pages (Actions target)
        uses: actions/deploy-pages@v4
        continue-on-error: true
